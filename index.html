    <style>
        :root {
            --bg: #ffffff;
            --text: #222222;
            --muted: #6b6b6b;
            --rule: #d4d4d4;
            --accent: #222222;
            --hover: #f2f2f2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161616;
                --text: #e8e6e3;
                --muted: #9a9a9a;
                --rule: #3a3a3a;
                --accent: #e8e6e3;
                --hover: #242424;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Computer Modern Serif', serif;
            font-size: 18px;
            background-color: var(--bg);
            color: var(--text);
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: 40px 20px 80px;
        }


        h1 {
            font-size: 3em;
            font-weight: normal;
            margin: 0 0 10px 0;
            letter-spacing: 0.01em;
            line-height: 1.1;
        }

        .intro {
            font-size: 1.2em;
            font-style: italic;
            line-height: 1.5;
            margin: 0 0 56px 0;
            color: var(--muted);
            max-width: 32em;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            border-radius: 2px;
        }

        /* Primary menu: small, spaced capitals, clearly below the title */
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        nav li + li::before {
            content: "·";
            margin: 0 1.1em;
            color: var(--muted);
        }

        nav a {
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
            transition: border-color 0.2s ease;
        }

        nav a:hover {
            border-bottom-color: currentColor;
        }

        /* Secondary links: outlined buttons */
        .profiles {
            margin-top: 36px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .profiles a {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            font-size: 0.85em;
            color: var(--text);
            border: 1px solid var(--rule);
            border-radius: 999px;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .profiles a:hover {
            background-color: var(--hover);
            border-color: var(--muted);
        }

        footer {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8em;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.3em; }
            .intro { font-size: 1.05em; margin-bottom: 40px; }
            nav ul { font-size: 0.9em; }
            footer { position: static; padding-bottom: 18px; }
        }
    </style>
